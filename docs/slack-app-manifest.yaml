# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# Least-privilege scopes for Quarterdeck: requests by mention or direct message,
# answers and files in the thread, buttons, and notifications. Socket Mode
# needs no public URL. Kept in step with app/channels/manifest.py (SCOPES,
# EVENTS, interactivity), which builds the same manifest for agent bots.
display_information:
  name: Quarterdeck
  description: Your private AI office. Posts status updates and takes your requests.
  background_color: "#1f3d2b"
features:
  # Lets the owner send the bot direct messages.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Quarterdeck
    always_online: false
oauth_config:
  # Only used for the OAuth install path, which needs an HTTPS address that
  # reaches your office. For your own workspace, "Install to Workspace" is enough.
  redirect_urls:
    - https://your-office.example.com/channels/slack/oauth/callback
  scopes:
    bot:
      - chat:write
      # Lets the office bot speak as one of your agents in a channel.
      - chat:write.customize
      - channels:read
      - groups:read
      - app_mentions:read
      - im:history
      - im:read
      - im:write
      - users:read
      # The work itself in the thread it was asked in: its document as a file.
      - files:write
      # Pictures and files you share with a question.
      - files:read
      # A 💡 you put on a message keeps it as an idea: the reaction, and the
      # one message it is on (read only when you react).
      - reactions:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - reaction_added
  # Buttons (Start, Stop, Rework...) arrive over Socket Mode: no request URL needed.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
